# MODELO DE CD — qualquer stack (PGC seções 6 e 9)
#
# Copie para o SEU repositório como:  .github/workflows/cd.yml
# Copie também  scripts/proxima-versao.mjs  da ONGConecta para a mesma pasta no seu repositório.
# Ajuste as linhas marcadas com  # <-- AJUSTE  (só o job "preparar" depende da sua stack).
#
#   merge na main
#     └─ preparar ..... calcula a versão (SemVer) e gera o PACOTE uma única vez
#         └─ staging .. pacote candidato disponível para teste (+ site em /staging, se usar Pages)
#             └─ producao ... AGUARDA APROVAÇÃO (Environment "production")
#                             cria a tag vX.Y.Z e a Release com notas + pacote anexado (baseline)
#                             (+ site na raiz, se usar Pages)
#
# Produção só acontece quando há versão nova (commit feat/fix desde a última tag).
#
# Site estático (HTML/React/Vue/Angular/Flutter web)? Crie a variável de repositório
#   PUBLICAR_PAGES = true   (Settings -> Secrets and variables -> Actions -> Variables)
# e ative Settings -> Pages -> branch gh-pages / (root). O build precisa usar caminhos relativos.

name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  preparar:
    name: Versão e pacote
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      release: ${{ steps.versao.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo: necessário para achar a última tag

      # O script de versão usa Node, que já vem instalado nos runners: vale para qualquer stack.
      - name: Calcular próxima versão (Conventional Commits)
        id: versao
        env:
          NOTAS_ARQUIVO: notas-release.md
        run: node scripts/proxima-versao.mjs

      # ================= INÍCIO DO TRECHO DA SUA STACK =================
      # Deixe UMA das opções abaixo e apague as outras. O resultado deve ficar na pasta "pacote/".

      # --- Opção Node com build (React, Vue, Angular, Next export...) ---
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Build (Node)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          npm ci
          npm run build
          cp -r dist pacote # <-- AJUSTE: pasta gerada pelo build (dist, build, out...)

      # --- Opção Java/Maven (descomente) ---
      # - uses: actions/setup-java@v6
      #   with: { distribution: temurin, java-version: '21', cache: maven }
      # - name: Build (Maven)
      #   run: |
      #     mvn -B versions:set -DnewVersion=${{ steps.versao.outputs.versao }}
      #     mvn -B package -DskipTests   # os testes já rodaram no CI
      #     mkdir pacote && cp target/*.jar pacote/

      # --- Opção código-fonte (descomente): Python, PHP, API Node sem build (Express)... ---
      # O pacote é o código da versão, sem build.
      # - name: Empacotar (código-fonte)
      #   run: |
      #     mkdir pacote
      #     git archive HEAD | tar -x -C pacote
      #     echo "${{ steps.versao.outputs.versao }}" > pacote/VERSAO
      # ================= FIM DO TRECHO DA SUA STACK ====================

      - name: Compactar pacote
        env:
          NOME: ${{ github.event.repository.name }}-${{ steps.versao.outputs.versao }}
        run: |
          test -d pacote || { echo "::error::A pasta pacote/ não foi criada pelo trecho da sua stack."; exit 1; }
          (cd pacote && zip -qr "../$NOME.zip" .)
          echo "Pacote gerado: $NOME.zip"

      - name: Guardar pacote (o MESMO vai para staging e produção)
        uses: actions/upload-artifact@v7
        with:
          name: pacote
          path: |
            *.zip
            notas-release.md
          retention-days: 30

  staging:
    name: Staging
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.PUBLICAR_PAGES == 'true' && format('{0}/staging/', env.SITE) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacote

      - name: Extrair pacote
        run: mkdir site && unzip -q ./*.zip -d site

      - name: Publicar em /staging (GitHub Pages)
        if: vars.PUBLICAR_PAGES == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: staging
          keep_files: true
          commit_message: 'deploy(staging): v${{ needs.preparar.outputs.versao }}'

      - name: Resumo
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          RELEASE: ${{ needs.preparar.outputs.release }}
        run: |
          {
            echo "## Staging — v$VERSAO"
            echo "- Pacote candidato: seção **Artifacts** desta execução (arquivo \`pacote\`)."
            if [ "$RELEASE" = "true" ]; then
              echo "- Teste o pacote e aprove o job **Produção** para criar a baseline v$VERSAO."
            else
              echo "- Sem commit feat/fix desde a última tag: não haverá release nova."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Produção
    needs: [preparar, staging]
    if: needs.preparar.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Environment "production" com Required reviewers: o job PAUSA até a aprovação (PGC 6.1).
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preparar.outputs.versao }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pacote
          path: entrega

      - name: Publicar na raiz (GitHub Pages)
        if: vars.PUBLICAR_PAGES == 'true'
        run: mkdir site && unzip -q entrega/*.zip -d site
      - if: vars.PUBLICAR_PAGES == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
          commit_message: 'deploy(producao): v${{ needs.preparar.outputs.versao }}'

      - name: Criar baseline — tag + Release com notas e pacote (PGC 9)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.preparar.outputs.versao }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG já existe — nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" entrega/*.zip --title "$TAG" \
            --notes-file entrega/notas-release.md --verify-tag
